services:
  postgres:
    image: postgres:16-alpine
    container_name: worknet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: worknet_db
    ports:
      - "5434:5432"
    volumes:
      - worknet_pgdata:/var/lib/postgresql/data

volumes:
  worknet_pgdata:
